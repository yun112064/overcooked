# T17 正式環境（單機）的附屬服務：T11 營養知識庫、飲食小幫手庫（PostgreSQL＋pgvector）與重排服務
#
#   docker compose --env-file .env.prod -f deploy/team/compose.yaml up -d --wait
#   .\scripts\prod-up.ps1        # 會一併啟動這裡的容器，再以主機原生程序啟動 YOLO、T11 知識服務、飲食小幫手
#
# - 所有埠只綁 127.0.0.1，不對外；對外只有 compose.prod.yaml 的 cloudflared（只轉到 frontend）。
# - 名稱與既有開發環境相同（overcooked-assistant-db／overcooked-assistant-reranker），已在跑的容器可直接沿用。
# - 知識庫 schema 由 knowledge_rag.bootstrap 依嵌入模型建立（本機 embeddinggemma 為 768 維），不在這裡初始化。
# - 每日備份由 scripts/backup-daily.ps1 一併執行（knowledge、assistant）。

name: meal-team

services:
  knowledge-db:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: meal-knowledge-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD in .env.prod}
      POSTGRES_DB: meal_knowledge
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - knowledge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meal_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  assistant-db:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: overcooked-assistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD in .env.prod}
      POSTGRES_DB: overcooked_assistant
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - assistant_pg:/var/lib/postgresql/data
      - ../../assistant_rag/schema.sql:/docker-entrypoint-initdb.d/10-assistant-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d overcooked_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  assistant-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:120-1.9.4
    container_name: overcooked-assistant-reranker
    command: ["--model-id", "/model"]
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      # 權重預先放在 Data Root，唯讀掛載，不在容器內下載（見 assistant_rag/README.md）
      - ${ASSISTANT_RERANKER_MODEL_DIR:?Set ASSISTANT_RERANKER_MODEL_DIR in .env.prod}:/model:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  knowledge_pg:
  # 與開發環境同名：已有的飲食小幫手語料與索引直接沿用，新電腦則自動建立
  assistant_pg:
    name: overcooked-assistant-pgdata

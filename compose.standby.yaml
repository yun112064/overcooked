# T17 展示備援：整套系統放在團隊電腦，對外只經 Cloudflare 快速通道（trycloudflare.com 臨時網址，免帳號、免網域）
#
#   .\scripts\standby-up.ps1        啟動（產生 .env.standby、安裝真實資料包、YOLO、通道）
#   .\scripts\standby-down.ps1      關閉（資料保留）
#   docker compose -p overcooked-standby --env-file .env.standby -f compose.yaml -f compose.standby.yaml config   檢查合併結果
#
# 限制（因此不能當 T17 正式部署，正式環境用 compose.prod.yaml）：
# - 網址每次重開都會變；電腦關機或斷線整站離線（違反 AC24「一般雲端功能及歷史仍可用」）。
# - 快速通道不支援 Server-Sent Events：飲食小幫手的串流回答送不到瀏覽器。
# - 同時最多 200 個進行中的請求、沒有可用性保證；Cloudflare 只建議用於測試與開發。
#
# - 主機不開任何連入埠：所有容器的 ports 清空；只有 cloudflared 主動連出，公開網址只轉到 frontend:80
#   （frontend 的 Caddy 只提供 HTTP 靜態檔並把 /api/* 轉給 backend，不處理憑證；/api/internal/* 一律 404）。
# - 資料全在本 project 的具名 volume（overcooked-standby_*），不碰開發用的資料庫與其 volume。
# - YOLO、T11 知識、飲食小幫手在主機原生執行（綁 127.0.0.1），容器經 host.docker.internal 連線；未設定則顯示不可用。
# - 秘密只放 .env.standby（不進 Git），由 standby-up 產生。

name: overcooked-standby

x-standby-database: &standby-database
  # standby-up 安裝資料包後寫入 .env.standby；尚未安裝時為空，後端的 schema 閘門會拒絕啟動
  DATABASE_URL: ${DATABASE_URL:-}
  NUTRITION_POLICY_MANIFEST: /app/release_data/nutrition-v1/policy.json
  NUTRITION_POLICY_MANIFEST_SHA256: ${NUTRITION_POLICY_MANIFEST_SHA256:-}

services:
  db:
    container_name: overcooked-standby-db
    ports: !reset []
    volumes: !override
      - standby_pg:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: overcooked-standby-backend
    container_name: overcooked-standby-backend
    ports: !reset []
    environment:
      <<: *standby-database
      ALLOWED_ORIGINS: https://${PUBLIC_HOSTNAME:-standby.invalid}
      COOKIE_SECURE: "true"
      AUTO_MIGRATE: "false"
      RECOGNITION_SERVICE_URL: http://host.docker.internal:${STANDBY_YOLO_PORT:-8776}
      RECOGNITION_SERVICE_TOKEN: ${INFERENCE_TOKEN:?Set INFERENCE_TOKEN in .env.standby}
      KNOWLEDGE_SERVICE_URL: ${KNOWLEDGE_SERVICE_URL:-}
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
      ASSISTANT_OPENAI_SERVICE_URL: ${ASSISTANT_OPENAI_SERVICE_URL:-}
      ASSISTANT_SERVICE_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env.standby}
    volumes: !override
      - standby_data:/app/data
      - standby_runtime:/app/runtime
      - standby_backups:/app/backups
    restart: unless-stopped

  worker:
    image: overcooked-standby-backend
    environment:
      <<: *standby-database
      KNOWLEDGE_SERVICE_URL: ${KNOWLEDGE_SERVICE_URL:-}
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
    volumes: !override
      - standby_data:/app/data
    restart: unless-stopped

  scheduler:
    image: overcooked-standby-backend
    profiles: !reset []
    environment:
      <<: *standby-database
    volumes: !override
      - standby_data:/app/data

  frontend:
    container_name: overcooked-standby-frontend
    ports: !reset []
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    container_name: overcooked-standby-cloudflared
    profiles: ["tunnel"]
    # 快速通道：不需 Cloudflare 帳號或 token，每次重建容器網址都會變
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    depends_on:
      frontend:
        condition: service_started
    # 不自動重啟：電腦重開後不會帶著新網址（與舊的 ALLOWED_ORIGINS 不符）自行上線，要重新執行 standby-up
    restart: "no"

volumes:
  standby_pg:
  standby_data:
  standby_runtime:
  standby_backups:

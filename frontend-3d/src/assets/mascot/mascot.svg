<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" class="mascot-svg">
  <!-- 吉祥物「小番茄主廚」：維持插畫風（平塗、圓潤、無材質），與寫實場景刻意區隔。
       可動部位以 class 標記，動畫由元件的 CSS 控制：
       m-shadow 影子｜m-leg-a / m-leg-b 雙腳｜m-arm-a / m-arm-b 雙手｜m-bob 身體（含臉、帽子） -->
  <ellipse class="m-shadow" cx="60" cy="133" rx="30" ry="5" fill="#1A1420" opacity=".3"/>

  <!-- 腳（髖關節在 y=104） -->
  <g class="m-leg-a">
    <path d="M48 102 V122" stroke="#C23B21" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="52" cy="126" rx="11" ry="6" fill="#3A2A20"/><ellipse cx="55" cy="124" rx="4" ry="2" fill="#6E5A4C"/>
  </g>
  <g class="m-leg-b">
    <path d="M72 102 V122" stroke="#C23B21" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="76" cy="126" rx="11" ry="6" fill="#3A2A20"/><ellipse cx="79" cy="124" rx="4" ry="2" fill="#6E5A4C"/>
  </g>

  <g class="m-bob">
    <!-- 後手 -->
    <g class="m-arm-b"><path d="M94 76 q14 4 16 16" fill="none" stroke="#D9472B" stroke-width="7" stroke-linecap="round"/><circle cx="110" cy="93" r="5.500" fill="#E8603F"/></g>

    <!-- 身體 -->
    <circle cx="60" cy="72" r="40" fill="#E8603F"/>
    <path d="M24 88 a40 40 0 0 0 72 0 a44 44 0 0 1 -72 0Z" fill="#D9472B"/>
    <ellipse cx="44" cy="52" rx="13" ry="8" fill="#F59C82" opacity=".85" transform="rotate(-28 44 52)"/>

    <!-- 臉 -->
    <circle cx="47" cy="72" r="5" fill="#3A2A20"/><circle cx="73" cy="72" r="5" fill="#3A2A20"/>
    <circle cx="48.500" cy="70.500" r="1.700" fill="#fff"/><circle cx="74.500" cy="70.500" r="1.700" fill="#fff"/>
    <ellipse cx="37" cy="83" rx="6" ry="4" fill="#F59C82" opacity=".9"/><ellipse cx="83" cy="83" rx="6" ry="4" fill="#F59C82" opacity=".9"/>
    <path d="M52 84 q8 8 16 0" fill="none" stroke="#3A2A20" stroke-width="3" stroke-linecap="round"/>

    <!-- 蒂頭 -->
    <path d="M60 38 l-16 -5 l11 -5 l-3 -11 l8 8 l8 -8 l-3 11 l11 5Z" fill="#3F7D4E"/>
    <!-- 廚師帽 -->
    <g>
      <circle cx="46" cy="16" r="11" fill="#FFFDF7"/><circle cx="60" cy="11" r="13" fill="#FFFDF7"/><circle cx="74" cy="16" r="11" fill="#FFFDF7"/>
      <rect x="42" y="18" width="36" height="13" rx="4" fill="#FFFDF7"/>
      <rect x="42" y="27" width="36" height="4" rx="2" fill="#F3E0C3"/>
    </g>

    <!-- 前手 -->
    <g class="m-arm-a"><path d="M26 76 q-14 4 -16 16" fill="none" stroke="#E8603F" stroke-width="7" stroke-linecap="round"/><circle cx="10" cy="93" r="5.500" fill="#F07352"/></g>
  </g>
</svg>

  <circle cx="240" cy="240" r="164" fill="url(#pt-bottom)"/>
  <path d="M96 190 A152 152 0 0 1 290 96 A170 170 0 0 0 96 190Z" fill="#3A2A20" opacity=".22" filter="url(#pt-b3)"/>

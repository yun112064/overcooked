    <radialGradient id="pt-broth" cx=".42" cy=".38" r=".75">
      <stop offset="0" stop-color="#F9D2A6"/><stop offset=".6" stop-color="#E9A56B"/><stop offset="1" stop-color="#C97A40"/>
    </radialGradient>

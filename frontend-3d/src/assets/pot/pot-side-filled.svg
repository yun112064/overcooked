<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170">
  <!-- 火鍋（側視，有料未蓋）：草稿或待送出。鍋口看得到湯與菜、菇、肉。 -->
  <defs>
    <filter id="ps-b4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="ps-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E170B"/><stop offset=".2" stop-color="#B2301A"/><stop offset=".36" stop-color="#E26A4A"/>
      <stop offset=".5" stop-color="#C8401F"/><stop offset=".82" stop-color="#96281A"/><stop offset="1" stop-color="#5E130A"/>
    </linearGradient>
    <linearGradient id="ps-under" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#2A0C06" stop-opacity="0"/><stop offset="1" stop-color="#2A0C06" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="ps-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C2413"/><stop offset=".35" stop-color="#F2917A"/><stop offset="1" stop-color="#8C2413"/>
    </linearGradient>
    <linearGradient id="ps-inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1410"/><stop offset="1" stop-color="#4A3A30"/>
    </linearGradient>
      <radialGradient id="ps-broth" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#F6C79A"/><stop offset="1" stop-color="#D98C52"/></radialGradient>
  </defs>
  <g><ellipse cx="120" cy="160" rx="92" ry="8" fill="#0E0A14" opacity=".5" filter="url(#ps-b4)"/>
  <!-- 把手 -->
  <path d="M30 70 q-26 0 -24 16 q2 12 26 10" fill="none" stroke="#96281A" stroke-width="11" stroke-linecap="round"/>
  <path d="M210 70 q26 0 24 16 q-2 12 -26 10" fill="none" stroke="#7E1C0E" stroke-width="11" stroke-linecap="round"/>
  <!-- 鍋身 -->
  <path d="M28 52 H212 V104 q0 54 -54 54 H82 q-54 0 -54 -54Z" fill="url(#ps-body)"/>
  <path d="M28 52 H212 V104 q0 54 -54 54 H82 q-54 0 -54 -54Z" fill="url(#ps-under)"/>
  <path d="M74 66 q-6 40 6 78" fill="none" stroke="#FFD2C2" stroke-width="7" stroke-linecap="round" opacity=".45" filter="url(#ps-b4)"/>
  <!-- 鍋口 -->
  <ellipse cx="120" cy="52" rx="92" ry="15" fill="url(#ps-rim)"/>
  <ellipse cx="120" cy="53" rx="84" ry="11" fill="url(#ps-inside)"/>
  <path d="M40 50 a84 11 0 0 1 160 0" fill="none" stroke="#FFD2C2" stroke-width="1.500" opacity=".7"/>
  <!-- 湯與料：菜、菇、肉 -->
  <ellipse cx="120" cy="54" rx="82" ry="10" fill="url(#ps-broth)"/>
  <g>
    <path d="M70 52 q6 -12 20 -8 q-2 10 -20 8Z" fill="#4E8A45"/><path d="M86 56 q10 -10 22 -4 q-6 8 -22 4Z" fill="#6FA85A"/>
    <path d="M118 50 q10 -10 20 0 q-10 4 -20 0Z" fill="#C9A77C"/><rect x="125" y="50" width="6" height="6" rx="2" fill="#EFE3CF"/>
    <path d="M146 54 q10 -9 24 -3 q-4 8 -24 3Z" fill="#B5553A"/><path d="M150 52 q8 -3 16 0" stroke="#F2B8A0" stroke-width="1.500" fill="none"/>
    <circle cx="104" cy="50" r="4" fill="#F2DC94"/><circle cx="176" cy="56" r="3.500" fill="#D9472B"/>
  </g>
  <path d="M40 50 a84 11 0 0 1 160 0" fill="none" stroke="#FFD2C2" stroke-width="1.500" opacity=".7"/>
</g>
</svg>

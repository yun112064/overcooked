<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 翻開的食譜書 z2：壓在右頁下緣的胡桃木托盤（已選的食譜由介面疊上）、書旁的鉛筆、羅勒、一杯茶 -->
  <defs>
    <filter id="bz2-woodh" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .5" numOctaves="3" seed="33"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .06  0 0 0 0 .02  1.7 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="bz2-b3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="bz2-b8"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="bz2-walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E6844"/><stop offset="1" stop-color="#5A3D24"/>
    </linearGradient>
    <radialGradient id="bz2-brass" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF0B8"/><stop offset=".4" stop-color="#D9B04E"/><stop offset="1" stop-color="#6E5216"/>
    </radialGradient>
    <linearGradient id="bz2-pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9952A"/><stop offset=".4" stop-color="#F6D25A"/><stop offset=".7" stop-color="#E2B13C"/><stop offset="1" stop-color="#A97F22"/>
    </linearGradient>
    <linearGradient id="bz2-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AEB6BD"/><stop offset=".4" stop-color="#EEF2F5"/><stop offset="1" stop-color="#8A9198"/>
    </linearGradient>
    <linearGradient id="bz2-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F5236"/><stop offset=".6" stop-color="#4E8A45"/><stop offset="1" stop-color="#9BCB78"/>
    </linearGradient>
    <radialGradient id="bz2-dish" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#EFEADF"/><stop offset="1" stop-color="#BDB6A8"/>
    </radialGradient>
    <radialGradient id="bz2-tea" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#D9A93F"/><stop offset="1" stop-color="#8E5E1A"/>
    </radialGradient>
  </defs>

  <!-- 托盤 -->
  <rect x="862" y="806" width="540" height="150" rx="18" fill="#0E0A14" opacity=".5" filter="url(#bz2-b8)"/>
  <rect x="850" y="790" width="540" height="150" rx="18" fill="url(#bz2-walnut)"/>
  <rect x="850" y="790" width="540" height="150" rx="18" fill="#000" filter="url(#bz2-woodh)"/>
  <path d="M850 922 V808 q0 -18 18 -18 H1372" fill="none" stroke="#C39A66" stroke-width="3" opacity=".8"/>
  <rect x="868" y="806" width="504" height="118" rx="10" fill="#3E2A18"/>
  <rect x="868" y="806" width="504" height="14" rx="7" fill="#17121C" opacity=".4" filter="url(#bz2-b3)"/>
  <path d="M868 924 H1372" stroke="#8E6844" stroke-width="2" opacity=".7"/>
  <g><circle cx="860" cy="865" r="9" fill="url(#bz2-brass)"/><circle cx="1380" cy="865" r="9" fill="url(#bz2-brass)"/></g>

  <!-- 鉛筆 -->
  <g transform="rotate(-8 110 520)">
    <rect x="102" y="300" width="22" height="430" rx="3" fill="#0E0A14" opacity=".4" filter="url(#bz2-b3)" transform="translate(5 5)"/>
    <rect x="98" y="336" width="22" height="350" fill="url(#bz2-pencil)"/>
    <rect x="98" y="312" width="22" height="26" fill="url(#bz2-steel)"/><rect x="98" y="296" width="22" height="18" rx="6" fill="#E88A7A"/>
    <path d="M98 686 h22 l-11 34Z" fill="#E9CFA0"/><path d="M105 708 h8 l-4 12Z" fill="#3A2A20"/>
  </g>

  <!-- 羅勒 -->
  <g transform="translate(96 150)">
    <ellipse cx="8" cy="12" rx="70" ry="50" fill="#0E0A14" opacity=".3" filter="url(#bz2-b8)"/>
    <path d="M-40 40 C-10 20 20 0 50 -30" fill="none" stroke="#4E8A45" stroke-width="5" stroke-linecap="round"/>
    <g fill="url(#bz2-leaf)">
      <path d="M-20 26 c-26 -6 -40 -26 -34 -48 c24 4 38 24 34 48Z"/>
      <path d="M-4 16 c8 -26 30 -38 52 -30 c-6 24 -28 36 -52 30Z" transform="rotate(40 -4 16)"/>
      <path d="M20 -4 c-22 -14 -28 -38 -14 -56 c20 12 26 36 14 56Z"/>
      <path d="M44 -24 c10 -22 32 -30 50 -20 c-8 20 -30 28 -50 20Z"/>
    </g>
    <g fill="none" stroke="#1F3A24" stroke-width="1.500" opacity=".5"><path d="M-20 26 q-22 -20 -34 -48 M20 -4 q-12 -26 -14 -56 M44 -24 q24 -14 50 -20"/></g>
  </g>

  <!-- 一杯茶 -->
  <g transform="translate(1516 50)">
    <circle cx="6" cy="8" r="88" fill="#0E0A14" opacity=".45" filter="url(#bz2-b8)"/>
    <circle r="86" fill="url(#bz2-dish)"/><circle r="64" fill="#E9E3D7"/>
    <path d="M46 -30 q44 -6 48 22 q2 22 -34 28" fill="none" stroke="#EFEADF" stroke-width="14" stroke-linecap="round"/>
    <circle r="56" fill="url(#bz2-dish)"/><circle r="46" fill="url(#bz2-tea)"/>
    <path d="M-32 -22 A40 40 0 0 1 14 -42" fill="none" stroke="#FFE9B4" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  </g>
</svg>

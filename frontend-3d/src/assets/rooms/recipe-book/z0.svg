<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 翻開的食譜書 z0：俯視的石紋流理台 -->
  <defs>
    <filter id="bz0-speck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="29"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .26  0 0 0 0 .2  1.6 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="bz0-b6"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="bz0-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE1"/><stop offset="1" stop-color="#D9D0BF"/>
    </linearGradient>
    <radialGradient id="bz0-pool" gradientUnits="userSpaceOnUse" cx="700" cy="300" r="1000">
      <stop offset="0" stop-color="#FFF3D6" stop-opacity=".55"/><stop offset=".6" stop-color="#FFE9C0" stop-opacity=".1"/><stop offset="1" stop-color="#FFE9C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bz0-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#201828" stop-opacity=".45"/><stop offset="1" stop-color="#201828" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bz0-stone)"/>
  <rect width="1600" height="1000" fill="#000" filter="url(#bz0-speck)" opacity=".7"/>
  <g fill="none" stroke="#C4B9A4" stroke-linecap="round" opacity=".55" filter="url(#bz0-b6)">
    <path d="M-20 200 C240 260 380 140 620 220 S1040 300 1260 200 S1540 260 1640 220" stroke-width="5"/>
    <path d="M-20 900 C220 860 460 960 700 900 S1100 860 1320 940 S1560 900 1640 920" stroke-width="4"/>
    <path d="M1480 -20 C1440 200 1540 380 1500 560" stroke-width="3"/>
  </g>
  <rect width="1600" height="1000" fill="url(#bz0-pool)"/>
  <rect width="1600" height="70" fill="url(#bz0-back)"/>
</svg>

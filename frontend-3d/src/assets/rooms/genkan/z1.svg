<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 玄關 z1：掛門牌的木軌與銅鉤、胡桃木百葉鞋櫃、傘桶、內門上的暖簾 -->
  <defs>
    <filter id="gz1-woodh" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .55" numOctaves="3" seed="13"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .06  0 0 0 0 .02  1.7 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="gz1-woodv" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".4 .01" numOctaves="3" seed="15"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .06  0 0 0 0 .02  1.7 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="gz1-cloth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2 1.2" numOctaves="2" seed="21"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .2  0 0 0 0 .08  0 0 0 0 .05  1.4 0 0 0 -.5"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="gz1-b3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="gz1-b8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="gz1-b16"><feGaussianBlur stdDeviation="16"/></filter>

    <linearGradient id="gz1-walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5636"/><stop offset="1" stop-color="#5A3D24"/>
    </linearGradient>
    <linearGradient id="gz1-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B58A5C"/><stop offset=".3" stop-color="#8E6844"/><stop offset="1" stop-color="#6B4A2C"/>
    </linearGradient>
    <linearGradient id="gz1-louver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A7650"/><stop offset=".65" stop-color="#6E4E30"/><stop offset=".66" stop-color="#2A1A10"/><stop offset="1" stop-color="#3A2616"/>
    </linearGradient>
    <pattern id="gz1-louvers" width="40" height="18" patternUnits="userSpaceOnUse">
      <rect width="40" height="18" fill="url(#gz1-louver)"/>
    </pattern>
    <radialGradient id="gz1-brass" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF0B8"/><stop offset=".4" stop-color="#D9B04E"/><stop offset="1" stop-color="#6E5216"/>
    </radialGradient>
    <linearGradient id="gz1-brassl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E5216"/><stop offset=".4" stop-color="#E9CB74"/><stop offset="1" stop-color="#7A5C1A"/>
    </linearGradient>
    <linearGradient id="gz1-zinc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A3640"/><stop offset=".4" stop-color="#6E6A76"/><stop offset=".62" stop-color="#9A96A2"/><stop offset="1" stop-color="#2E2A34"/>
    </linearGradient>
    <linearGradient id="gz1-noren" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C2E1C"/><stop offset=".2" stop-color="#B2452E"/><stop offset=".45" stop-color="#96331F"/>
      <stop offset=".7" stop-color="#B8492F"/><stop offset="1" stop-color="#84291A"/>
    </linearGradient>
    <linearGradient id="gz1-bamboo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9C28A"/><stop offset=".5" stop-color="#B89A5C"/><stop offset="1" stop-color="#7A6234"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 -44)">

  <!-- 掛鉤木軌 -->
  <rect x="270" y="196" width="636" height="40" fill="#17121C" opacity=".4" filter="url(#gz1-b8)"/>
  <rect x="262" y="176" width="636" height="40" rx="3" fill="url(#gz1-walnut)"/>
  <rect x="262" y="176" width="636" height="40" rx="3" fill="#000" filter="url(#gz1-woodh)"/>
  <rect x="262" y="176" width="636" height="4" rx="2" fill="#B58A5C" opacity=".9"/>
  <rect x="262" y="212" width="636" height="4" rx="2" fill="#2A1A10" opacity=".6"/>
  <!-- 銅鉤 ×4 -->
  <g>
    <g id="gz1-hook">
      <circle cx="362" cy="198" r="10" fill="#17121C" opacity=".4" filter="url(#gz1-b3)"/>
      <circle cx="360" cy="196" r="9" fill="url(#gz1-brass)"/>
      <path d="M360 200 V222 q0 10 10 8" fill="none" stroke="url(#gz1-brassl)" stroke-width="5" stroke-linecap="round"/>
    </g>
    <use href="#gz1-hook" x="160"/><use href="#gz1-hook" x="320"/><use href="#gz1-hook" x="480"/>
  </g>

  <!-- 鞋櫃：牆上與地上的陰影 -->
  <rect x="250" y="520" width="690" height="290" fill="#17121C" opacity=".32" filter="url(#gz1-b16)"/>
  <ellipse cx="580" cy="806" rx="350" ry="12" fill="#0E0A14" opacity=".55" filter="url(#gz1-b8)"/>
  <!-- 櫃腳 -->
  <rect x="278" y="784" width="22" height="22" fill="#2A1A10"/><rect x="860" y="784" width="22" height="22" fill="#2A1A10"/>
  <!-- 櫃身 -->
  <rect x="258" y="526" width="644" height="262" fill="url(#gz1-walnut)"/>
  <rect x="258" y="526" width="644" height="262" fill="#000" filter="url(#gz1-woodv)"/>
  <!-- 三片百葉門 -->
  <g>
    <g id="gz1-doorleaf">
      <rect x="272" y="544" width="200" height="230" fill="#4A321E"/>
      <rect x="272" y="544" width="200" height="230" fill="#000" filter="url(#gz1-woodv)"/>
      <rect x="290" y="562" width="164" height="194" fill="url(#gz1-louvers)"/>
      <path d="M290 562 h164 v194" fill="none" stroke="#1E120A" stroke-width="3" opacity=".7"/>
      <path d="M272 774 V544 H472" fill="none" stroke="#9A7650" stroke-width="2" opacity=".7"/>
      <path d="M472 544 V774 H272" fill="none" stroke="#1E120A" stroke-width="2" opacity=".7"/>
    </g>
    <use href="#gz1-doorleaf" x="210"/><use href="#gz1-doorleaf" x="420"/>
    <g>
      <circle cx="458" cy="662" r="8" fill="#17121C" opacity=".5" filter="url(#gz1-b3)"/><circle cx="456" cy="660" r="7" fill="url(#gz1-brass)"/>
      <circle cx="498" cy="662" r="8" fill="#17121C" opacity=".5" filter="url(#gz1-b3)"/><circle cx="496" cy="660" r="7" fill="url(#gz1-brass)"/>
      <circle cx="878" cy="662" r="8" fill="#17121C" opacity=".5" filter="url(#gz1-b3)"/><circle cx="876" cy="660" r="7" fill="url(#gz1-brass)"/>
    </g>
  </g>
  <!-- 檯面 -->
  <rect x="244" y="500" width="672" height="30" fill="url(#gz1-top)"/>
  <rect x="244" y="500" width="672" height="30" fill="#000" filter="url(#gz1-woodh)"/>
  <rect x="244" y="500" width="672" height="4" fill="#E2BE8C" opacity=".85"/>
  <rect x="258" y="530" width="644" height="12" fill="#17121C" opacity=".45" filter="url(#gz1-b3)"/>

  <!-- 傘桶與雨傘 -->
  <ellipse cx="1004" cy="806" rx="64" ry="9" fill="#0E0A14" opacity=".5" filter="url(#gz1-b8)"/>
  <g>
    <path d="M984 664 L974 430 q-2 -26 -22 -22" fill="none" stroke="#6B4A2C" stroke-width="9" stroke-linecap="round"/>
    <path d="M972 668 L980 470 L996 668Z" fill="#84291A"/>
    <path d="M980 470 L986 668" stroke="#5E170B" stroke-width="2" opacity=".7"/>
    <path d="M1020 664 L1034 452 q2 -24 22 -18" fill="none" stroke="#2A2630" stroke-width="8" stroke-linecap="round"/>
    <path d="M1008 668 L1030 486 L1036 668Z" fill="#34573A"/>
    <path d="M1030 486 L1024 668" stroke="#1F3A24" stroke-width="2" opacity=".7"/>
  </g>
  <path d="M956 656 h96 l-8 144 h-80Z" fill="url(#gz1-zinc)"/>
  <ellipse cx="1004" cy="656" rx="48" ry="9" fill="#17141C"/>
  <ellipse cx="1004" cy="656" rx="48" ry="9" fill="none" stroke="#A8A4B0" stroke-width="2"/>
  <path d="M959 700 h90 M962 760 h84" stroke="#2A2630" stroke-width="3" opacity=".6"/>

  <!-- 暖簾 -->
  <rect x="1056" y="160" width="378" height="26" fill="#17121C" opacity=".4" filter="url(#gz1-b8)"/>
  <rect x="1056" y="146" width="378" height="14" rx="7" fill="url(#gz1-bamboo)"/>
  <g>
    <path d="M1090 156 h100 v168 q-50 10 -100 0Z" fill="url(#gz1-noren)"/>
    <path d="M1196 156 h100 v172 q-50 10 -100 0Z" fill="url(#gz1-noren)"/>
    <path d="M1302 156 h98 v168 q-49 10 -98 0Z" fill="url(#gz1-noren)"/>
    <path d="M1090 156 h100 v168 q-50 10 -100 0Z M1196 156 h100 v172 q-50 10 -100 0Z M1302 156 h98 v168 q-49 10 -98 0Z" fill="#000" filter="url(#gz1-cloth)" opacity=".5"/>
    <!-- 番茄紋 -->
    <circle cx="1246" cy="246" r="30" fill="none" stroke="#F6E6D2" stroke-width="5" opacity=".9"/>
    <path d="M1246 222 l-11 -7 l8 -2 l3 -9 l3 9 l8 2Z" fill="#F6E6D2" opacity=".9"/>
    <!-- 下襬陰影 -->
    <path d="M1090 316 q50 10 100 0 v8 q-50 10 -100 0Z M1196 320 q50 10 100 0 v8 q-50 10 -100 0Z M1302 316 q49 10 98 0 v8 q-49 10 -98 0Z" fill="#3E0F08" opacity=".5"/>
  </g>
  </g>
</svg>

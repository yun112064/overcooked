<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 玄關 z3：前景——剛推開的大門（內側）、腳邊的踏墊、暗角 -->
  <defs>
    <filter id="gz3-woodv" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".3 .008" numOctaves="3" seed="19"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .14  0 0 0 0 .04  0 0 0 0 .02  1.7 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="gz3-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .2  0 0 0 0 .13  0 0 0 0 .06  1.6 0 0 0 -.55"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="gz3-b4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="gz3-b18"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="gz3-door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E130A"/><stop offset=".7" stop-color="#7E2112"/><stop offset="1" stop-color="#96301C"/>
    </linearGradient>
    <linearGradient id="gz3-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8492F"/><stop offset="1" stop-color="#6E1C0E"/>
    </linearGradient>
    <linearGradient id="gz3-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0B8"/><stop offset=".4" stop-color="#D9B04E"/><stop offset="1" stop-color="#6E5216"/>
    </linearGradient>
    <radialGradient id="gz3-vig" cx=".5" cy=".48" r=".78">
      <stop offset=".55" stop-color="#150F1E" stop-opacity="0"/><stop offset="1" stop-color="#150F1E" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <!-- 大門在牆與地上的陰影 -->
  <rect x="100" y="-20" width="110" height="1040" fill="#0E0A14" opacity=".5" filter="url(#gz3-b18)"/>

  <!-- 推開的大門（內側，貼近鏡頭所以失焦） -->
  <g filter="url(#gz3-b4)">
    <rect x="-60" y="-30" width="170" height="1060" fill="url(#gz3-door)"/>
    <rect x="-60" y="-30" width="170" height="1060" fill="#000" filter="url(#gz3-woodv)"/>
    <rect x="-20" y="120" width="96" height="330" fill="none" stroke="#3E0F08" stroke-width="6" opacity=".8"/>
    <rect x="-20" y="520" width="96" height="380" fill="none" stroke="#3E0F08" stroke-width="6" opacity=".8"/>
    <rect x="110" y="-30" width="18" height="1060" fill="url(#gz3-edge)"/>
    <rect x="110" y="-30" width="3" height="1060" fill="#E0876C" opacity=".7"/>
    <!-- 內側門把 -->
    <rect x="52" y="470" width="20" height="78" rx="4" fill="url(#gz3-brass)"/>
    <rect x="18" y="494" width="48" height="13" rx="6" fill="url(#gz3-brass)"/>
  </g>

  <!-- 腳邊的椰纖踏墊（只露出上緣） -->
  <path d="M520 962 H1080 L1110 1010 H490Z" fill="#8E6C40"/>
  <path d="M520 962 H1080 L1110 1010 H490Z" fill="#000" filter="url(#gz3-grain)"/>
  <path d="M520 962 H1080" stroke="#C9A56E" stroke-width="3" opacity=".7"/>
  <path d="M540 974 H1062" stroke="#5E4426" stroke-width="3" opacity=".8"/>

  <!-- 暗角 -->
  <rect x="-80" y="-60" width="1760" height="1120" fill="url(#gz3-vig)"/>
</svg>

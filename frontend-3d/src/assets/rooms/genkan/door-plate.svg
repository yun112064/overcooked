<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220">
  <!-- 門牌：掛在銅鉤上的小屋形木牌，一張＝一個家庭；名稱與成員數由 HTML 疊上 -->
  <defs>
    <filter id="dpl-wood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .5" numOctaves="3" seed="12"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .4  0 0 0 0 .26  0 0 0 0 .1  1.5 0 0 0 -.6"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="dpl-b5" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="dpl-maple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0DDB8"/><stop offset="1" stop-color="#D2B585"/>
    </linearGradient>
    <radialGradient id="dpl-brass" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF0B8"/><stop offset=".4" stop-color="#D9B04E"/><stop offset="1" stop-color="#6E5216"/>
    </radialGradient>
  </defs>
  <!-- 麻繩 -->
  <path d="M80 8 L52 70 M80 8 L108 70" stroke="#5E4426" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M80 8 L52 70 M80 8 L108 70" stroke="#C9A56E" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/>
  <!-- 投影 -->
  <path d="M18 112 L88 58 L158 112 V206 q0 8 -8 8 H26 q-8 0 -8 -8Z" fill="#120A08" opacity=".5" filter="url(#dpl-b5)"/>
  <!-- 木牌 -->
  <path d="M10 104 L80 50 L150 104 V198 q0 8 -8 8 H18 q-8 0 -8 -8Z" fill="url(#dpl-maple)"/>
  <path d="M10 104 L80 50 L150 104 V198 q0 8 -8 8 H18 q-8 0 -8 -8Z" fill="#000" filter="url(#dpl-wood)" opacity=".7"/>
  <path d="M10 104 L80 50 L150 104Z" fill="#8E6A46" opacity=".28"/>
  <path d="M10 104 L80 50 L150 104" fill="none" stroke="#FFF6E0" stroke-width="2.5" opacity=".9"/>
  <path d="M150 104 V198 q0 8 -8 8 H18 q-8 0 -8 -8" fill="none" stroke="#7A5C36" stroke-width="2.5" opacity=".8"/>
  <!-- 穿繩孔 -->
  <circle cx="52" cy="76" r="5" fill="url(#dpl-brass)"/><circle cx="52" cy="76" r="2.200" fill="#2A1A10"/>
  <circle cx="108" cy="76" r="5" fill="url(#dpl-brass)"/><circle cx="108" cy="76" r="2.200" fill="#2A1A10"/>
</svg>

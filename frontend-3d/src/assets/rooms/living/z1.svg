<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 客廳 z1：立燈、綠色布沙發（抱枕、毯子）、胡桃木電視櫃與電視、編籃盆栽 -->
  <defs>
    <filter id="lz1-fabric" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="17"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .08  0 0 0 0 .14  0 0 0 0 .08  1.5 0 0 0 -.52"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="lz1-woodh" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .55" numOctaves="3" seed="13"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .06  0 0 0 0 .02  1.7 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="lz1-b3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="lz1-b8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="lz1-b18"><feGaussianBlur stdDeviation="18"/></filter>

    <linearGradient id="lz1-sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E7D57"/><stop offset="1" stop-color="#3C5639"/>
    </linearGradient>
    <radialGradient id="lz1-cushion" cx=".45" cy=".35" r=".8">
      <stop offset="0" stop-color="#7A9B70"/><stop offset=".6" stop-color="#587752"/><stop offset="1" stop-color="#3F5A3C"/>
    </radialGradient>
    <linearGradient id="lz1-seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C9D72"/><stop offset=".25" stop-color="#638260"/><stop offset="1" stop-color="#456242"/>
    </linearGradient>
    <linearGradient id="lz1-arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A5238"/><stop offset=".5" stop-color="#5E7D57"/><stop offset="1" stop-color="#42603F"/>
    </linearGradient>
    <linearGradient id="lz1-mustard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9BE58"/><stop offset="1" stop-color="#A97F22"/>
    </linearGradient>
    <linearGradient id="lz1-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EFE0"/><stop offset="1" stop-color="#C9BEA9"/>
    </linearGradient>
    <linearGradient id="lz1-blanket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C2E1C"/><stop offset=".25" stop-color="#B8492F"/><stop offset=".5" stop-color="#96331F"/>
      <stop offset=".75" stop-color="#BD4D33"/><stop offset="1" stop-color="#84291A"/>
    </linearGradient>
    <linearGradient id="lz1-walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5636"/><stop offset="1" stop-color="#5A3D24"/>
    </linearGradient>
    <linearGradient id="lz1-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B58A5C"/><stop offset=".3" stop-color="#8E6844"/><stop offset="1" stop-color="#6B4A2C"/>
    </linearGradient>
    <linearGradient id="lz1-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232838"/><stop offset="1" stop-color="#0C0E14"/>
    </linearGradient>
    <linearGradient id="lz1-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3DDB0"/><stop offset=".5" stop-color="#FFF1CC"/><stop offset="1" stop-color="#FFE2A0"/>
    </linearGradient>
    <radialGradient id="lz1-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE9B4" stop-opacity=".9"/><stop offset=".4" stop-color="#FFD48A" stop-opacity=".32"/><stop offset="1" stop-color="#FFD48A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lz1-brass" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF0B8"/><stop offset=".4" stop-color="#D9B04E"/><stop offset="1" stop-color="#6E5216"/>
    </radialGradient>
    <linearGradient id="lz1-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#27422C"/><stop offset=".6" stop-color="#3F6B45"/><stop offset="1" stop-color="#7BA765"/>
    </linearGradient>
    <pattern id="lz1-wicker" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#B08A56"/>
      <path d="M0 3 h8 M8 9 h8" stroke="#D9B98A" stroke-width="4"/><path d="M0 9 h8 M8 3 h8" stroke="#7A5C36" stroke-width="2"/>
    </pattern>
    <linearGradient id="lz1-basket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17121C" stop-opacity=".45"/><stop offset=".5" stop-color="#17121C" stop-opacity="0"/><stop offset="1" stop-color="#17121C" stop-opacity=".4"/>
    </linearGradient>
  </defs>

  <!-- 立燈（沙發右後方） -->
  <circle cx="606" cy="290" r="250" fill="url(#lz1-glow)"/>
  <ellipse cx="606" cy="722" rx="40" ry="7" fill="#0E0A14" opacity=".5" filter="url(#lz1-b3)"/>
  <ellipse cx="606" cy="718" rx="30" ry="7" fill="#2A2630"/>
  <rect x="603" y="312" width="6" height="406" fill="#2A2630"/>
  <path d="M566 244 h80 l16 70 h-112Z" fill="url(#lz1-shade)"/>
  <path d="M566 244 h80 M550 314 h112" stroke="#C9A56E" stroke-width="2"/>

  <!-- 沙發在牆上與地上的陰影 -->
  <rect x="30" y="430" width="580" height="300" rx="40" fill="#17121C" opacity=".3" filter="url(#lz1-b18)"/>
  <ellipse cx="310" cy="752" rx="300" ry="14" fill="#0E0A14" opacity=".55" filter="url(#lz1-b8)"/>
  <!-- 沙發腳 -->
  <g fill="#3E2A18"><path d="M70 726 h22 l-4 28 h-12Z"/><path d="M300 726 h22 l-4 28 h-14Z"/><path d="M528 726 h22 l-6 28 h-12Z"/></g>
  <!-- 椅背 -->
  <path d="M68 480 q0 -36 36 -36 h412 q36 0 36 36 v170 h-484Z" fill="url(#lz1-sofa)"/>
  <!-- 背墊 -->
  <rect x="96" y="456" width="212" height="170" rx="30" fill="url(#lz1-cushion)"/>
  <rect x="312" y="456" width="212" height="170" rx="30" fill="url(#lz1-cushion)"/>
  <path d="M310 462 V620" stroke="#2C4029" stroke-width="5" opacity=".7" filter="url(#lz1-b3)"/>
  <!-- 扶手 -->
  <rect x="40" y="504" width="74" height="226" rx="32" fill="url(#lz1-arm)"/>
  <rect x="506" y="504" width="74" height="226" rx="32" fill="url(#lz1-arm)"/>
  <!-- 坐墊 -->
  <rect x="106" y="596" width="204" height="98" rx="22" fill="url(#lz1-seat)"/>
  <rect x="310" y="596" width="204" height="98" rx="22" fill="url(#lz1-seat)"/>
  <path d="M310 602 V690" stroke="#2C4029" stroke-width="4" opacity=".7" filter="url(#lz1-b3)"/>
  <path d="M112 600 h192 M316 600 h192" stroke="#A9C49C" stroke-width="3" opacity=".45" stroke-linecap="round"/>
  <!-- 底座 -->
  <rect x="68" y="684" width="484" height="44" rx="10" fill="#34492F"/>
  <rect x="68" y="684" width="484" height="12" fill="#17121C" opacity=".35" filter="url(#lz1-b3)"/>
  <!-- 布料質感 -->
  <path d="M68 480 q0 -36 36 -36 h412 q36 0 36 36 v248 h-484Z" fill="#000" filter="url(#lz1-fabric)" opacity=".55"/>
  <rect x="40" y="504" width="74" height="226" rx="32" fill="#000" filter="url(#lz1-fabric)" opacity=".55"/>
  <rect x="506" y="504" width="74" height="226" rx="32" fill="#000" filter="url(#lz1-fabric)" opacity=".55"/>

  <!-- 芥末黃抱枕 -->
  <g transform="rotate(-10 170 560)">
    <rect x="128" y="518" width="96" height="92" rx="14" fill="#17121C" opacity=".35" filter="url(#lz1-b3)" transform="translate(4 6)"/>
    <rect x="124" y="514" width="96" height="92" rx="14" fill="url(#lz1-mustard)"/>
    <rect x="124" y="514" width="96" height="92" rx="14" fill="#000" filter="url(#lz1-fabric)" opacity=".4"/>
    <path d="M136 526 q36 14 72 0" fill="none" stroke="#FFF0B8" stroke-width="2" opacity=".5"/>
  </g>
  <!-- 米白針織抱枕 -->
  <g transform="rotate(8 420 566)">
    <rect x="376" y="524" width="92" height="88" rx="14" fill="#17121C" opacity=".35" filter="url(#lz1-b3)" transform="translate(4 6)"/>
    <rect x="372" y="520" width="92" height="88" rx="14" fill="url(#lz1-cream)"/>
    <g stroke="#A89C88" stroke-width="2" opacity=".6"><path d="M388 524 v80 M404 522 v84 M420 522 v84 M436 522 v84 M452 524 v80"/></g>
  </g>
  <!-- 披在右扶手上的番茄紅毯子 -->
  <path d="M500 500 q44 -14 86 4 q6 70 -4 150 l-10 -6 l-8 8 l-10 -8 l-8 8 l-10 -8 l-8 8 l-10 -8 l-8 6 q-8 -84 8 -154Z" fill="url(#lz1-blanket)"/>
  <path d="M500 500 q44 -14 86 4 q6 70 -4 150 h-74 q-8 -84 -8 -154Z" fill="#000" filter="url(#lz1-fabric)" opacity=".5"/>
  <path d="M506 510 q40 -10 76 2" fill="none" stroke="#E0876C" stroke-width="2" opacity=".6"/>

  <!-- 電視櫃 -->
  <rect x="612" y="590" width="384" height="110" fill="#17121C" opacity=".3" filter="url(#lz1-b18)"/>
  <ellipse cx="800" cy="716" rx="200" ry="10" fill="#0E0A14" opacity=".55" filter="url(#lz1-b8)"/>
  <g fill="#2A1A10"><path d="M640 676 h18 l-4 38 h-8Z"/><path d="M942 676 h18 l-6 38 h-8Z"/></g>
  <rect x="624" y="602" width="352" height="78" fill="url(#lz1-walnut)"/>
  <rect x="624" y="602" width="352" height="78" fill="#000" filter="url(#lz1-woodh)"/>
  <path d="M742 610 V672 M858 610 V672" stroke="#2A1A10" stroke-width="3" opacity=".8"/>
  <path d="M632 610 h104 v62 h-104Z M748 610 h104 v62 h-104Z M864 610 h104 v62 h-104Z" fill="none" stroke="#9A7650" stroke-width="1.5" opacity=".5"/>
  <g><circle cx="684" cy="641" r="5" fill="url(#lz1-brass)"/><circle cx="800" cy="641" r="5" fill="url(#lz1-brass)"/><circle cx="916" cy="641" r="5" fill="url(#lz1-brass)"/></g>
  <rect x="614" y="588" width="372" height="18" fill="url(#lz1-top)"/>
  <rect x="614" y="588" width="372" height="18" fill="#000" filter="url(#lz1-woodh)"/>
  <rect x="614" y="588" width="372" height="3" fill="#E2BE8C" opacity=".85"/>

  <!-- 電視 -->
  <rect x="640" y="380" width="320" height="214" fill="#6E8CD9" opacity=".22" filter="url(#lz1-b18)"/>
  <rect x="760" y="580" width="80" height="8" rx="3" fill="#17141C"/><rect x="792" y="570" width="16" height="14" fill="#17141C"/>
  <rect x="650" y="390" width="300" height="184" rx="6" fill="#0A0A0E"/>
  <rect x="656" y="396" width="288" height="172" rx="2" fill="url(#lz1-screen)"/>
  <path d="M656 396 h150 l-110 172 h-40Z" fill="#FFFFFF" opacity=".045"/>
  <rect x="650" y="390" width="300" height="184" rx="6" fill="none" stroke="#3A3A46" stroke-width="1.5"/>

  <!-- 櫃上的小花瓶 -->
  <ellipse cx="966" cy="590" rx="14" ry="3" fill="#17121C" opacity=".5" filter="url(#lz1-b3)"/>
  <path d="M956 588 q-6 -22 6 -30 h8 q12 8 6 30Z" fill="#E9E2D4"/>
  <path d="M966 558 q-2 -22 -12 -34 M966 558 q4 -20 14 -28" fill="none" stroke="#5E7D57" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#D9472B"><circle cx="954" cy="522" r="5"/><circle cx="981" cy="528" r="4.500"/></g>

  <!-- 編籃盆栽（琴葉榕） -->
  <ellipse cx="1096" cy="712" rx="70" ry="10" fill="#0E0A14" opacity=".55" filter="url(#lz1-b8)"/>
  <path d="M1096 624 C1092 560 1100 500 1094 430" fill="none" stroke="#5A3D24" stroke-width="8" stroke-linecap="round"/>
  <g fill="url(#lz1-leaf)">
    <path d="M1094 430 c-34 -30 -34 -74 -6 -96 c26 26 26 68 6 96Z"/>
    <path d="M1096 470 c-44 -4 -70 -34 -66 -66 c38 0 66 26 66 66Z"/>
    <path d="M1098 480 c40 -12 70 -44 62 -78 c-38 6 -64 38 -62 78Z"/>
    <path d="M1094 530 c-46 6 -78 -18 -80 -50 c38 -8 72 14 80 50Z"/>
    <path d="M1098 540 c44 0 74 -28 72 -60 c-40 -2 -70 24 -72 60Z"/>
    <path d="M1094 588 c-40 12 -72 -4 -80 -34 c34 -12 68 4 80 34Z"/>
    <path d="M1098 596 c38 6 68 -14 72 -44 c-36 -8 -66 12 -72 44Z"/>
  </g>
  <g fill="none" stroke="#1F3A24" stroke-width="1.5" opacity=".5">
    <path d="M1094 430 q-14 -46 -6 -96 M1096 470 q-28 -36 -66 -66 M1098 480 q30 -36 62 -78 M1094 530 q-34 -30 -80 -50 M1098 540 q34 -28 72 -60"/>
  </g>
  <path d="M1048 622 h96 l-10 84 h-76Z" fill="url(#lz1-wicker)"/>
  <path d="M1048 622 h96 l-10 84 h-76Z" fill="url(#lz1-basket)"/>
  <rect x="1042" y="614" width="108" height="12" rx="6" fill="#C9A56E"/>
</svg>

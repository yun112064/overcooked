<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 單板＋鍋 z2：爐前的一排備料碟（菜、菇、肉、配菜）與高湯壺。每完成一步，對應那一碟的料會進鍋。 -->
  <defs>
    <filter id="pz2-b3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="pz2-b6"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="pz2-dish" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#EFEADF"/><stop offset="1" stop-color="#BDB6A8"/>
    </radialGradient>
    <linearGradient id="pz2-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F5236"/><stop offset=".6" stop-color="#4E8A45"/><stop offset="1" stop-color="#9BCB78"/>
    </linearGradient>
    <radialGradient id="pz2-shroom" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#B98A5C"/><stop offset=".7" stop-color="#7A5636"/><stop offset="1" stop-color="#4A321E"/>
    </radialGradient>
    <linearGradient id="pz2-meat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A090"/><stop offset=".5" stop-color="#D2604A"/><stop offset="1" stop-color="#A63C2A"/>
    </linearGradient>
    <radialGradient id="pz2-corn" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFF0A0"/><stop offset=".7" stop-color="#F2C23A"/><stop offset="1" stop-color="#C9952A"/>
    </radialGradient>
    <radialGradient id="pz2-tom" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#FF9A7C"/><stop offset=".45" stop-color="#DC4426"/><stop offset="1" stop-color="#861C0E"/>
    </radialGradient>
    <radialGradient id="pz2-broth" cx=".42" cy=".38" r=".75">
      <stop offset="0" stop-color="#F9D2A6"/><stop offset=".6" stop-color="#E9A56B"/><stop offset="1" stop-color="#C97A40"/>
    </radialGradient>
    <linearGradient id="pz2-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7F9"/><stop offset=".5" stop-color="#B9C0C6"/><stop offset="1" stop-color="#7C848C"/>
    </linearGradient>
    <g id="pz2-plate">
      <circle cx="4" cy="6" r="60" fill="#0E0A14" opacity=".45" filter="url(#pz2-b6)"/>
      <circle r="58" fill="url(#pz2-dish)"/><circle r="44" fill="#F7F3EA"/>
      <circle r="44" fill="none" stroke="#D9D2C5" stroke-width="2"/>
      <path d="M-42 -34 A54 54 0 0 1 26 -48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    </g>
  </defs>

  <!-- 菜 -->
  <g transform="translate(880 916)">
    <use href="#pz2-plate"/>
    <g transform="rotate(-30)"><path d="M0 26 C-18 6 -16 -22 0 -40 C16 -22 18 6 0 26Z" fill="url(#pz2-leaf)"/><path d="M0 26 C-6 12 -5 0 0 -10 C5 0 6 12 0 26Z" fill="#EAF2D6"/></g>
    <g transform="translate(14 4) rotate(20)"><path d="M0 26 C-18 6 -16 -22 0 -40 C16 -22 18 6 0 26Z" fill="url(#pz2-leaf)"/><path d="M0 26 C-6 12 -5 0 0 -10 C5 0 6 12 0 26Z" fill="#EAF2D6"/></g>
    <g transform="translate(-14 8) rotate(-70)"><path d="M0 22 C-14 6 -12 -18 0 -32 C12 -18 14 6 0 22Z" fill="url(#pz2-leaf)"/></g>
  </g>
  <!-- 菇 -->
  <g transform="translate(1020 916)">
    <use href="#pz2-plate"/>
    <g><circle cx="-14" cy="-8" r="17" fill="url(#pz2-shroom)"/><path d="M-14 -17 v18 M-22 -13 l16 10 M-22 -3 l16 -10" stroke="#F3E3CA" stroke-width="3" stroke-linecap="round"/></g>
    <g><circle cx="16" cy="-2" r="15" fill="url(#pz2-shroom)"/><path d="M16 -10 v16 M9 -6 l14 8 M9 2 l14 -8" stroke="#F3E3CA" stroke-width="3" stroke-linecap="round"/></g>
    <g><circle cx="-2" cy="20" r="13" fill="url(#pz2-shroom)"/><path d="M-2 13 v14 M-8 17 l12 6 M-8 23 l12 -6" stroke="#F3E3CA" stroke-width="2.500" stroke-linecap="round"/></g>
  </g>
  <!-- 肉 -->
  <g transform="translate(1160 916)">
    <use href="#pz2-plate"/>
    <g transform="translate(-4 -16) rotate(-10)"><ellipse rx="26" ry="13" fill="url(#pz2-meat)"/><path d="M-18 0 q7 -9 18 -7 q12 2 14 9 q-5 6 -14 6 q-8 0 -9 -6" fill="none" stroke="#FBE3DA" stroke-width="2.500" stroke-linecap="round"/></g>
    <g transform="translate(4 6) rotate(8)"><ellipse rx="26" ry="13" fill="url(#pz2-meat)"/><path d="M-18 0 q7 -9 18 -7 q12 2 14 9 q-5 6 -14 6 q-8 0 -9 -6" fill="none" stroke="#FBE3DA" stroke-width="2.500" stroke-linecap="round"/></g>
    <g transform="translate(-6 26) rotate(-6)"><ellipse rx="22" ry="10" fill="url(#pz2-meat)"/><path d="M-14 0 q6 -7 14 -5 q10 2 11 7" fill="none" stroke="#FBE3DA" stroke-width="2.500" stroke-linecap="round"/></g>
  </g>
  <!-- 配菜：玉米、番茄、蛋 -->
  <g transform="translate(1300 916)">
    <use href="#pz2-plate"/>
    <circle cx="-16" cy="-10" r="16" fill="url(#pz2-corn)"/><circle cx="-16" cy="-10" r="5" fill="#F6E2A0"/>
    <circle cx="16" cy="-12" r="14" fill="url(#pz2-tom)"/><path d="M16 -18 l-5 -3 l4 -1 l1 -4 l1 4 l4 1Z" fill="#34573A"/>
    <ellipse cx="2" cy="18" rx="15" ry="18" fill="#FFFDF7" transform="rotate(70 2 18)"/><circle cx="2" cy="18" r="8" fill="#E88A2A"/>
  </g>
  <!-- 高湯壺 -->
  <g transform="translate(1450 912)">
    <circle cx="5" cy="7" r="66" fill="#0E0A14" opacity=".45" filter="url(#pz2-b6)"/>
    <path d="M52 -14 q40 0 40 14 q0 14 -40 14" fill="none" stroke="url(#pz2-steel)" stroke-width="14" stroke-linecap="round"/>
    <path d="M-50 -34 l-26 -14 l4 26Z" fill="url(#pz2-steel)"/>
    <circle r="62" fill="url(#pz2-steel)"/><circle r="52" fill="#8A9198"/><circle r="50" fill="url(#pz2-broth)"/>
    <path d="M-36 -22 A44 44 0 0 1 18 -44" fill="none" stroke="#FFF3DC" stroke-width="4" stroke-linecap="round" opacity=".6"/>
    <g fill="#FFF3DC" opacity=".6"><circle cx="10" cy="12" r="4"/><circle cx="-12" cy="22" r="3"/><circle cx="24" cy="-6" r="2.500"/></g>
  </g>
</svg>

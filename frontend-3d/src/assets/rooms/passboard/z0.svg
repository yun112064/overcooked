<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 單板＋鍋 z0：俯視的石紋流理台 -->
  <defs>
    <filter id="pz0-speck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="12"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .26  0 0 0 0 .2  1.6 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="pz0-b6"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="pz0-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDE1"/><stop offset="1" stop-color="#D9D0BF"/>
    </linearGradient>
    <radialGradient id="pz0-pool" gradientUnits="userSpaceOnUse" cx="560" cy="260" r="1000">
      <stop offset="0" stop-color="#FFF3D6" stop-opacity=".55"/><stop offset=".6" stop-color="#FFE9C0" stop-opacity=".1"/><stop offset="1" stop-color="#FFE9C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pz0-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#201828" stop-opacity=".45"/><stop offset="1" stop-color="#201828" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#pz0-stone)"/>
  <rect width="1600" height="1000" fill="#000" filter="url(#pz0-speck)" opacity=".7"/>
  <!-- 石紋 -->
  <g fill="none" stroke="#C4B9A4" stroke-linecap="round" opacity=".55" filter="url(#pz0-b6)">
    <path d="M-20 320 C200 280 320 420 560 380 S900 300 1100 420 S1500 360 1640 440" stroke-width="5"/>
    <path d="M-20 760 C180 700 420 820 640 760 S1000 700 1240 800 S1520 740 1640 780" stroke-width="4"/>
    <path d="M300 -20 C340 160 260 300 320 460" stroke-width="3"/>
  </g>
  <rect width="1600" height="1000" fill="url(#pz0-pool)"/>
  <!-- 靠牆那一側的陰影 -->
  <rect width="1600" height="70" fill="url(#pz0-back)"/>
</svg>

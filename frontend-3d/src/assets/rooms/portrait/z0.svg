<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 全家福 z0：客廳的牆（近看）、畫燈打下來的光、右側立燈的餘光 -->
  <defs>
    <filter id="rz0p-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .16  0 0 0 0 .12  0 0 0 0 .1  1.5 0 0 0 -.55"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="rz0p-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6B9A2"/><stop offset=".3" stop-color="#DFD3BC"/><stop offset="1" stop-color="#D5C7AE"/>
    </linearGradient>
    <radialGradient id="rz0p-pool" gradientUnits="userSpaceOnUse" cx="800" cy="360" r="760">
      <stop offset="0" stop-color="#FFEFCB" stop-opacity=".75"/><stop offset=".5" stop-color="#FFE0A8" stop-opacity=".2"/><stop offset="1" stop-color="#FFE0A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rz0p-lamp" gradientUnits="userSpaceOnUse" cx="1560" cy="340" r="420">
      <stop offset="0" stop-color="#FFE3A8" stop-opacity=".6"/><stop offset="1" stop-color="#FFE3A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rz0p-sides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#201828" stop-opacity=".45"/><stop offset=".2" stop-color="#201828" stop-opacity="0"/>
      <stop offset=".86" stop-color="#201828" stop-opacity="0"/><stop offset="1" stop-color="#201828" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="rz0p-ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#201828" stop-opacity=".5"/><stop offset="1" stop-color="#201828" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#rz0p-wall)"/>
  <rect width="1600" height="1000" fill="#000" filter="url(#rz0p-grain)" opacity=".13"/>
  <rect width="1600" height="1000" fill="url(#rz0p-pool)"/>
  <rect width="1600" height="1000" fill="url(#rz0p-lamp)"/>
  <rect width="1600" height="120" fill="url(#rz0p-ceil)"/>
  <rect width="1600" height="1000" fill="url(#rz0p-sides)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440">
  <!-- 寫實風名牌卡：厚紙卡、麻繩、黃銅釘、柔和投影 -->
  <defs>
    <filter id="rnc-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .12  1.2 0 0 0 -.52"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="rnc-b6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="rnc-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF5E8"/><stop offset="1" stop-color="#EFE4CF"/>
    </linearGradient>
    <radialGradient id="rnc-brass" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF0B8"/><stop offset=".4" stop-color="#D9B04E"/><stop offset="1" stop-color="#6E5216"/>
    </radialGradient>
  </defs>
  <!-- 麻繩 -->
  <path d="M160 18 L62 88 M160 18 L258 88" stroke="#5E4426" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M160 18 L62 88 M160 18 L258 88" stroke="#C9A56E" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/>
  <!-- 投影 -->
  <rect x="20" y="82" width="296" height="352" rx="6" fill="#120A08" opacity=".5" filter="url(#rnc-b6)"/>
  <!-- 厚紙卡 -->
  <rect x="8" y="66" width="304" height="360" rx="6" fill="url(#rnc-paper)"/>
  <rect x="8" y="66" width="304" height="360" rx="6" fill="#000" filter="url(#rnc-grain)" opacity=".18"/>
  <rect x="8" y="66" width="304" height="360" rx="6" fill="none" stroke="#B9A888" stroke-width="1.5"/>
  <rect x="8" y="66" width="304" height="3" rx="1.5" fill="#FFFFFF" opacity=".8"/>
  <!-- 金屬孔眼 -->
  <circle cx="62" cy="90" r="8" fill="url(#rnc-brass)"/><circle cx="62" cy="90" r="3.5" fill="#2A1A10"/>
  <circle cx="258" cy="90" r="8" fill="url(#rnc-brass)"/><circle cx="258" cy="90" r="3.5" fill="#2A1A10"/>
  <!-- 黃銅釘 -->
  <circle cx="162" cy="21" r="12" fill="#120A08" opacity=".4" filter="url(#rnc-b6)"/>
  <circle cx="160" cy="18" r="11" fill="url(#rnc-brass)"/>
</svg>

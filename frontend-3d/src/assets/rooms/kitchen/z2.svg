<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 廚房 z2：檯面上的雙口瓦斯爐（鍋由介面疊上）、闔上的精裝食譜書（分類標籤與紅緞帶）、砧板與食材、廚具筒、油瓶與胡椒罐 -->
  <defs>
    <filter id="kz2-cloth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="17"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .12  0 0 0 0 .06  1.5 0 0 0 -.52"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="kz2-woodh" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".01 .5" numOctaves="3" seed="27"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .18  0 0 0 0 .08  1.6 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="kz2-b2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="kz2-b4"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="kz2-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2F5"/><stop offset=".45" stop-color="#B9C0C6"/><stop offset="1" stop-color="#7C848C"/>
    </linearGradient>
    <linearGradient id="kz2-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3842"/><stop offset=".5" stop-color="#17151C"/><stop offset="1" stop-color="#0C0B10"/>
    </linearGradient>
    <radialGradient id="kz2-knob" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#B9C0C6"/><stop offset="1" stop-color="#4A5158"/>
    </radialGradient>
    <linearGradient id="kz2-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8A62"/><stop offset=".6" stop-color="#3F6B45"/><stop offset="1" stop-color="#2E5236"/>
    </linearGradient>
    <linearGradient id="kz2-pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EA"/><stop offset="1" stop-color="#D9CFBC"/>
    </linearGradient>
    <linearGradient id="kz2-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9822C"/><stop offset=".5" stop-color="#F2DC94"/><stop offset="1" stop-color="#A9822C"/>
    </linearGradient>
    <linearGradient id="kz2-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C2413"/><stop offset=".5" stop-color="#D2482C"/><stop offset="1" stop-color="#96281A"/>
    </linearGradient>
    <linearGradient id="kz2-board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6CBA0"/><stop offset="1" stop-color="#C39A66"/>
    </linearGradient>
    <radialGradient id="kz2-tom" cx=".36" cy=".3" r=".75">
      <stop offset="0" stop-color="#FF9A7C"/><stop offset=".4" stop-color="#DC4426"/><stop offset="1" stop-color="#861C0E"/>
    </radialGradient>
    <radialGradient id="kz2-shroom" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#F3E3CA"/><stop offset=".6" stop-color="#C9A77C"/><stop offset="1" stop-color="#8E6A46"/>
    </radialGradient>
    <linearGradient id="kz2-leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F5236"/><stop offset=".6" stop-color="#4E8A45"/><stop offset="1" stop-color="#9BCB78"/>
    </linearGradient>
    <linearGradient id="kz2-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7F9"/><stop offset="1" stop-color="#9AA1A8"/>
    </linearGradient>
    <linearGradient id="kz2-ceramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9A296"/><stop offset=".5" stop-color="#EFEADF"/><stop offset=".75" stop-color="#FFFBF2"/><stop offset="1" stop-color="#C9C2B5"/>
    </linearGradient>
    <linearGradient id="kz2-oil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E5A14"/><stop offset=".4" stop-color="#D9B93A"/><stop offset=".6" stop-color="#F2DC7A"/><stop offset="1" stop-color="#8A7018"/>
    </linearGradient>
    <linearGradient id="kz2-mill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E2A18"/><stop offset=".45" stop-color="#8E6844"/><stop offset="1" stop-color="#4A321E"/>
    </linearGradient>
  </defs>

  <!-- 雙口瓦斯爐 -->
  <rect x="664" y="596" width="340" height="10" fill="#0E0A14" opacity=".5" filter="url(#kz2-b4)"/>
  <rect x="660" y="566" width="340" height="32" rx="3" fill="url(#kz2-steel)"/>
  <rect x="660" y="566" width="340" height="3" fill="#FFFFFF" opacity=".9"/>
  <path d="M674 548 H986 L1000 568 H660Z" fill="url(#kz2-glass)"/>
  <path d="M674 548 H986" stroke="#6E6A76" stroke-width="1.500"/>
  <path d="M690 550 h110 l-14 16 h-106Z" fill="#FFFFFF" opacity=".06"/>
  <!-- 爐架 ×2 -->
  <g>
    <g id="kz2-burner">
      <ellipse cx="752" cy="558" rx="64" ry="8" fill="#0A090C"/>
      <ellipse cx="752" cy="556" rx="30" ry="4" fill="#3A3842"/>
      <g fill="#1E1C24"><rect x="690" y="548" width="20" height="8" rx="2"/><rect x="794" y="548" width="20" height="8" rx="2"/><rect x="742" y="544" width="20" height="8" rx="2"/></g>
      <g fill="#55525C"><rect x="690" y="548" width="20" height="2"/><rect x="794" y="548" width="20" height="2"/><rect x="742" y="544" width="20" height="2"/></g>
    </g>
    <use href="#kz2-burner" x="156"/>
  </g>
  <!-- 旋鈕與火力刻度 -->
  <g>
    <circle cx="722" cy="583" r="11" fill="#17121C" opacity=".4" transform="translate(1 2)"/><circle cx="722" cy="582" r="11" fill="url(#kz2-knob)"/><rect x="721" y="573" width="2.500" height="9" rx="1" fill="#D9472B"/>
    <circle cx="938" cy="583" r="11" fill="#17121C" opacity=".4" transform="translate(1 2)"/><circle cx="938" cy="582" r="11" fill="url(#kz2-knob)"/><rect x="937" y="573" width="2.500" height="9" rx="1" fill="#3A2A20"/>
    <rect x="800" y="578" width="60" height="8" rx="4" fill="#4A5158" opacity=".6"/>
  </g>

  <!-- 闔上的精裝食譜書 -->
  <path d="M176 606 L404 596 L412 604 L182 616Z" fill="#0E0A14" opacity=".5" filter="url(#kz2-b4)"/>
  <!-- 書口的分類標籤 -->
  <g>
    <path d="M372 548 l20 -1 l3 8 l-20 1Z" fill="#E7A72E"/><path d="M377 558 l20 -1 l3 8 l-20 1Z" fill="#B07A45"/>
    <path d="M382 568 l20 -1 l3 8 l-20 1Z" fill="#5B8DD9"/><path d="M387 578 l20 -1 l3 8 l-20 1Z" fill="#B48AD1"/>
  </g>
  <!-- 書頁 -->
  <path d="M168 586 L392 576 V598 L168 608Z" fill="url(#kz2-pages)"/>
  <g stroke="#B9AD96" stroke-width="1" opacity=".8"><path d="M168 591 L392 581 M168 596 L392 586 M168 601 L392 591"/></g>
  <path d="M370 540 L392 576 V598 L370 562Z" fill="#E9E0CE"/>
  <!-- 書脊與封底邊 -->
  <path d="M150 548 L168 586 V608 L150 570Z" fill="#274A30"/>
  <path d="M150 570 L168 608 L392 598 V602 L168 612 L148 574Z" fill="#274A30"/>
  <!-- 封面 -->
  <path d="M150 548 L370 540 L392 576 L168 586Z" fill="url(#kz2-cover)"/>
  <path d="M150 548 L370 540 L392 576 L168 586Z" fill="#000" filter="url(#kz2-cloth)" opacity=".6"/>
  <path d="M172 553 L360 546 L376 572 L186 580Z" fill="none" stroke="url(#kz2-gold)" stroke-width="2"/>
  <path d="M214 558 L330 554 L338 566 L220 571Z" fill="none" stroke="url(#kz2-gold)" stroke-width="1.500"/>
  <ellipse cx="276" cy="562" rx="9" ry="4.500" fill="url(#kz2-gold)"/>
  <path d="M150 548 L370 540" stroke="#9BCB9E" stroke-width="1.500" opacity=".7"/>
  <!-- 紅緞帶書籤 -->
  <path d="M296 603 l14 -1 l2 40 l-8 -7 l-8 8Z" fill="url(#kz2-ribbon)"/>
  <path d="M296 603 l14 -1 v6 l-14 1Z" fill="#5E170B" opacity=".5"/>

  <!-- 砧板與食材 -->
  <path d="M438 600 L618 596 L622 602 L436 606Z" fill="#0E0A14" opacity=".45" filter="url(#kz2-b4)"/>
  <path d="M446 566 L600 562 L618 592 L434 598Z" fill="url(#kz2-board)"/>
  <path d="M446 566 L600 562 L618 592 L434 598Z" fill="#000" filter="url(#kz2-woodh)" opacity=".8"/>
  <path d="M434 598 L618 592 V598 L434 604Z" fill="#8E6A46"/>
  <!-- 青江菜 -->
  <g>
    <path d="M462 588 q-4 -22 10 -34 q8 14 4 34Z" fill="url(#kz2-leaf)"/>
    <path d="M474 588 q-2 -30 14 -44 q10 18 2 44Z" fill="url(#kz2-leaf)"/>
    <path d="M488 588 q2 -24 18 -34 q6 16 -4 34Z" fill="url(#kz2-leaf)"/>
    <path d="M458 590 q22 -10 46 0 q-4 6 -12 6 h-22 q-8 0 -12 -6Z" fill="#E6EFD2"/>
  </g>
  <!-- 香菇 ×2 -->
  <g>
    <ellipse cx="528" cy="590" rx="16" ry="4" fill="#0E0A14" opacity=".4" filter="url(#kz2-b2)"/>
    <rect x="523" y="578" width="10" height="12" rx="4" fill="#EFE3CF"/><path d="M510 580 q18 -22 36 0 q-18 6 -36 0Z" fill="url(#kz2-shroom)"/>
    <rect x="547" y="582" width="9" height="10" rx="4" fill="#EFE3CF"/><path d="M536 584 q15 -18 30 0 q-15 5 -30 0Z" fill="url(#kz2-shroom)"/>
  </g>
  <!-- 番茄 -->
  <ellipse cx="588" cy="588" rx="16" ry="4" fill="#0E0A14" opacity=".4" filter="url(#kz2-b2)"/>
  <circle cx="586" cy="574" r="15" fill="url(#kz2-tom)"/>
  <path d="M586 560 l-8 -5 l6 -1 l2 -7 l2 7 l6 1Z" fill="#34573A"/>
  <!-- 菜刀 -->
  <g transform="rotate(-4 430 592)">
    <path d="M402 586 h70 l-6 12 h-64Z" fill="url(#kz2-blade)"/><path d="M402 586 h70" stroke="#FFFFFF" stroke-width="1.500"/>
    <rect x="372" y="586" width="32" height="9" rx="3" fill="#3E2A18"/><circle cx="380" cy="590.500" r="1.500" fill="#D9B04E"/><circle cx="394" cy="590.500" r="1.500" fill="#D9B04E"/>
  </g>

  <!-- 廚具筒 -->
  <ellipse cx="1072" cy="600" rx="40" ry="6" fill="#0E0A14" opacity=".45" filter="url(#kz2-b4)"/>
  <g>
    <path d="M1058 536 L1048 440" stroke="#C39A66" stroke-width="7" stroke-linecap="round"/><ellipse cx="1046" cy="428" rx="12" ry="18" fill="#C39A66" transform="rotate(-6 1046 428)"/>
    <path d="M1072 536 V430" stroke="#8E6844" stroke-width="7" stroke-linecap="round"/><rect x="1060" y="400" width="24" height="38" rx="6" fill="#8E6844"/>
    <path d="M1086 536 L1098 450" stroke="#B9C0C6" stroke-width="5" stroke-linecap="round"/><ellipse cx="1100" cy="438" rx="11" ry="15" fill="none" stroke="#B9C0C6" stroke-width="3" transform="rotate(8 1100 438)"/>
  </g>
  <path d="M1042 528 h60 l-4 70 h-52Z" fill="url(#kz2-ceramic)"/>
  <ellipse cx="1072" cy="528" rx="30" ry="6" fill="#6E675A"/>
  <path d="M1045 556 h54" stroke="#3F7D4E" stroke-width="6" opacity=".8"/>

  <!-- 橄欖油與胡椒罐 -->
  <ellipse cx="1150" cy="600" rx="44" ry="6" fill="#0E0A14" opacity=".45" filter="url(#kz2-b4)"/>
  <path d="M1124 598 V520 q0 -14 8 -20 V478 h12 v22 q8 6 8 20 v78Z" fill="url(#kz2-oil)" opacity=".92"/>
  <rect x="1130" y="468" width="16" height="12" rx="3" fill="#3A2A20"/>
  <rect x="1128" y="540" width="20" height="34" rx="2" fill="#F6F0E4"/><path d="M1132 550 h12 M1132 558 h12 M1132 566 h8" stroke="#6E5A4C" stroke-width="2"/>
  <rect x="1128" y="506" width="4" height="86" rx="2" fill="#FFFFFF" opacity=".45"/>
  <path d="M1166 598 q-6 -20 0 -40 q-4 -10 2 -18 q-4 -12 6 -18 h4 q10 6 6 18 q6 8 2 18 q6 20 0 40Z" fill="url(#kz2-mill)"/>
  <ellipse cx="1176" cy="520" rx="9" ry="4" fill="#B9C0C6"/>
</svg>

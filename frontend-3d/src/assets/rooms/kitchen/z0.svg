<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 廚房 z0：亮面磁磚牆、左上的出菜口（看得到餐廳）、出菜口下的單軌、抽油煙機、掛桿與廚具、香料架、石磚地 -->
  <defs>
    <filter id="kz0-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .16  0 0 0 0 .12  0 0 0 0 .1  1.5 0 0 0 -.55"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="kz0-woodh" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .55" numOctaves="3" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .06  0 0 0 0 .02  1.7 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="kz0-woodv" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".45 .01" numOctaves="3" seed="6"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .14  0 0 0 0 .08  0 0 0 0 .04  1.6 0 0 0 -.62"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="kz0-b3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="kz0-b6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="kz0-b14"><feGaussianBlur stdDeviation="14"/></filter>

    <linearGradient id="kz0-tileg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EE"/><stop offset=".2" stop-color="#F1EBDF"/><stop offset="1" stop-color="#E4DCCB"/>
    </linearGradient>
    <pattern id="kz0-tile" width="84" height="84" patternUnits="userSpaceOnUse">
      <rect width="84" height="84" fill="#B9AE9B"/>
      <rect x="1.500" y="1.500" width="81" height="39" rx="2" fill="url(#kz0-tileg)"/>
      <rect x="-40.500" y="43.500" width="81" height="39" rx="2" fill="url(#kz0-tileg)"/><rect x="43.500" y="43.500" width="81" height="39" rx="2" fill="url(#kz0-tileg)"/>
      <rect x="4" y="3" width="76" height="2" fill="#FFFFFF" opacity=".8"/><rect x="46" y="45" width="36" height="2" fill="#FFFFFF" opacity=".8"/><rect x="0" y="45" width="38" height="2" fill="#FFFFFF" opacity=".8"/>
    </pattern>
    <radialGradient id="kz0-pool" gradientUnits="userSpaceOnUse" cx="760" cy="300" r="820">
      <stop offset="0" stop-color="#FFF1CF" stop-opacity=".55"/><stop offset=".5" stop-color="#FFE3AE" stop-opacity=".16"/><stop offset="1" stop-color="#FFE3AE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kz0-sides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#201828" stop-opacity=".38"/><stop offset=".16" stop-color="#201828" stop-opacity="0"/>
      <stop offset=".88" stop-color="#201828" stop-opacity="0"/><stop offset="1" stop-color="#201828" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="kz0-ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#201828" stop-opacity=".45"/><stop offset="1" stop-color="#201828" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kz0-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5636"/><stop offset="1" stop-color="#553A22"/>
    </linearGradient>
    <linearGradient id="kz0-ledge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C39A66"/><stop offset=".3" stop-color="#8E6844"/><stop offset="1" stop-color="#5A3D24"/>
    </linearGradient>
    <linearGradient id="kz0-dining" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD9B0"/><stop offset="1" stop-color="#F8E8C2"/>
    </linearGradient>
    <radialGradient id="kz0-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFEDBE" stop-opacity=".95"/><stop offset=".4" stop-color="#FFD48A" stop-opacity=".4"/><stop offset="1" stop-color="#FFD48A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kz0-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C848C"/><stop offset=".3" stop-color="#C9D0D6"/><stop offset=".5" stop-color="#EEF2F5"/><stop offset=".72" stop-color="#AEB6BD"/><stop offset="1" stop-color="#7C848C"/>
    </linearGradient>
    <linearGradient id="kz0-steelv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2F5"/><stop offset=".5" stop-color="#AEB6BD"/><stop offset="1" stop-color="#6E757C"/>
    </linearGradient>
    <linearGradient id="kz0-hoodlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3CF" stop-opacity=".55"/><stop offset="1" stop-color="#FFF3CF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kz0-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E857A"/><stop offset="1" stop-color="#B9AF9F"/>
    </linearGradient>
    <clipPath id="kz0-hatch"><rect x="104" y="84" width="452" height="218"/></clipPath>
  </defs>

  <!-- 磁磚牆 -->
  <rect width="1600" height="870" fill="url(#kz0-tile)"/>
  <rect width="1600" height="870" fill="url(#kz0-pool)"/>
  <rect width="1600" height="120" fill="url(#kz0-ceil)"/>

  <!-- 出菜口：木框 -->
  <rect x="88" y="72" width="500" height="262" fill="#17121C" opacity=".35" filter="url(#kz0-b6)"/>
  <rect x="80" y="60" width="500" height="250" fill="url(#kz0-frame)"/>
  <rect x="80" y="60" width="500" height="250" fill="#000" filter="url(#kz0-woodv)"/>
  <path d="M80 310 V60 H580" fill="none" stroke="#B58A5C" stroke-width="3" opacity=".8"/>
  <!-- 出菜口裡的餐廳（失焦） -->
  <g clip-path="url(#kz0-hatch)">
    <rect x="104" y="84" width="452" height="218" fill="url(#kz0-dining)"/>
    <g filter="url(#kz0-b6)">
      <rect x="130" y="110" width="110" height="130" fill="#C9B48A"/><rect x="140" y="120" width="90" height="110" fill="#8E7FA8"/>
      <path d="M330 84 V128" stroke="#2A2630" stroke-width="4"/>
      <path d="M286 170 q4 -44 44 -44 q40 0 44 44Z" fill="#B8492F"/>
      <ellipse cx="330" cy="300" rx="200" ry="22" fill="#8E6844"/>
      <ellipse cx="330" cy="292" rx="200" ry="22" fill="#C39A66"/>
      <ellipse cx="270" cy="284" rx="40" ry="9" fill="#F6F0E4"/><ellipse cx="380" cy="288" rx="46" ry="10" fill="#F6F0E4"/>
      <ellipse cx="380" cy="284" rx="26" ry="6" fill="#5E8A4A"/><ellipse cx="270" cy="280" rx="22" ry="5" fill="#D9843A"/>
      <rect x="474" y="232" width="52" height="70" rx="10" fill="#7A5636"/><rect x="140" y="246" width="48" height="56" rx="10" fill="#7A5636"/>
    </g>
    <circle cx="330" cy="176" r="230" fill="url(#kz0-glow)"/>
    <rect x="104" y="84" width="452" height="18" fill="#17121C" opacity=".25" filter="url(#kz0-b6)"/>
    <rect x="104" y="84" width="26" height="218" fill="#17121C" opacity=".3" filter="url(#kz0-b6)"/>
  </g>
  <rect x="104" y="84" width="452" height="218" fill="none" stroke="#2A1A10" stroke-width="3"/>
  <!-- 出菜口檯面 -->
  <rect x="70" y="330" width="520" height="14" fill="#17121C" opacity=".4" filter="url(#kz0-b6)"/>
  <rect x="66" y="298" width="528" height="30" fill="url(#kz0-ledge)"/>
  <rect x="66" y="298" width="528" height="30" fill="#000" filter="url(#kz0-woodh)"/>
  <rect x="66" y="298" width="528" height="4" fill="#E9CFA0" opacity=".9"/>

  <!-- 單軌：鋁製點菜單夾軌（單子由介面疊上） -->
  <rect x="112" y="362" width="444" height="12" fill="#17121C" opacity=".35" filter="url(#kz0-b3)"/>
  <rect x="150" y="328" width="8" height="26" fill="#6E757C"/><rect x="510" y="328" width="8" height="26" fill="#6E757C"/>
  <rect x="108" y="348" width="444" height="16" rx="3" fill="url(#kz0-steelv)"/>
  <rect x="108" y="348" width="444" height="3" rx="1.5" fill="#FFFFFF" opacity=".9"/>
  <rect x="108" y="360" width="444" height="4" rx="2" fill="#4A5158"/>

  <!-- 抽油煙機 -->
  <rect x="784" y="-10" width="96" height="130" fill="url(#kz0-steel)"/>
  <path d="M700 114 H964 L1014 204 H650Z" fill="url(#kz0-steel)"/>
  <path d="M700 114 H964" stroke="#FFFFFF" stroke-width="2" opacity=".8"/>
  <rect x="650" y="204" width="364" height="16" fill="#4A5158"/><rect x="650" y="204" width="364" height="3" fill="#C9D0D6"/>
  <rect x="770" y="208" width="120" height="8" rx="3" fill="#FFF3CF"/>
  <path d="M670 220 H994 L1060 560 H604Z" fill="url(#kz0-hoodlight)" filter="url(#kz0-b14)"/>

  <!-- 掛桿與廚具 -->
  <g>
    <rect x="664" y="396" width="332" height="7" rx="3.500" fill="url(#kz0-steelv)"/>
    <g fill="#17121C" opacity=".25" filter="url(#kz0-b3)" transform="translate(8 6)">
      <rect x="716" y="404" width="6" height="74"/><ellipse cx="719" cy="494" rx="18" ry="16"/>
      <rect x="790" y="404" width="7" height="60"/><rect x="778" y="462" width="30" height="46" rx="6"/>
      <rect x="866" y="404" width="6" height="52"/><ellipse cx="869" cy="484" rx="15" ry="30"/>
      <rect x="940" y="404" width="6" height="40"/><circle cx="943" cy="470" r="26"/>
    </g>
    <!-- 湯勺 -->
    <rect x="716" y="404" width="6" height="74" fill="url(#kz0-steel)"/><ellipse cx="719" cy="494" rx="18" ry="16" fill="url(#kz0-steel)"/><ellipse cx="716" cy="490" rx="10" ry="8" fill="#FFFFFF" opacity=".35"/>
    <!-- 鍋鏟 -->
    <rect x="790" y="404" width="7" height="60" fill="#6B4A2C"/><rect x="778" y="462" width="30" height="46" rx="6" fill="url(#kz0-steel)"/>
    <g fill="#4A5158"><rect x="785" y="472" width="4" height="26" rx="2"/><rect x="792" y="472" width="4" height="26" rx="2"/><rect x="799" y="472" width="4" height="26" rx="2"/></g>
    <!-- 打蛋器 -->
    <rect x="866" y="404" width="6" height="52" fill="url(#kz0-steel)"/>
    <g fill="none" stroke="#AEB6BD" stroke-width="2"><ellipse cx="869" cy="484" rx="15" ry="30"/><ellipse cx="869" cy="484" rx="8" ry="30"/><path d="M869 454 V514"/></g>
    <!-- 濾網 -->
    <rect x="940" y="404" width="6" height="40" fill="#6B4A2C"/><circle cx="943" cy="470" r="26" fill="none" stroke="url(#kz0-steel)" stroke-width="5"/>
    <circle cx="943" cy="470" r="22" fill="#AEB6BD" opacity=".35"/>
  </g>

  <!-- 香料架 -->
  <rect x="1044" y="330" width="160" height="12" fill="#17121C" opacity=".35" filter="url(#kz0-b3)"/>
  <rect x="1040" y="312" width="160" height="14" fill="url(#kz0-ledge)"/><rect x="1040" y="312" width="160" height="3" fill="#E9CFA0"/>
  <g>
    <g><rect x="1052" y="262" width="28" height="50" rx="5" fill="#E9E2D4" opacity=".85"/><rect x="1054" y="282" width="24" height="28" rx="3" fill="#B2301A"/><rect x="1050" y="254" width="32" height="10" rx="3" fill="#6B4A2C"/></g>
    <g><rect x="1088" y="262" width="28" height="50" rx="5" fill="#E9E2D4" opacity=".85"/><rect x="1090" y="276" width="24" height="34" rx="3" fill="#D9A93F"/><rect x="1086" y="254" width="32" height="10" rx="3" fill="#6B4A2C"/></g>
    <g><rect x="1124" y="262" width="28" height="50" rx="5" fill="#E9E2D4" opacity=".85"/><rect x="1126" y="286" width="24" height="24" rx="3" fill="#4E6B4A"/><rect x="1122" y="254" width="32" height="10" rx="3" fill="#6B4A2C"/></g>
    <g><rect x="1160" y="262" width="28" height="50" rx="5" fill="#E9E2D4" opacity=".85"/><rect x="1162" y="280" width="24" height="30" rx="3" fill="#3A2A20"/><rect x="1158" y="254" width="32" height="10" rx="3" fill="#6B4A2C"/></g>
    <g fill="#FFFFFF" opacity=".5"><rect x="1056" y="266" width="4" height="40" rx="2"/><rect x="1092" y="266" width="4" height="40" rx="2"/><rect x="1128" y="266" width="4" height="40" rx="2"/><rect x="1164" y="266" width="4" height="40" rx="2"/></g>
  </g>

  <!-- 石磚地 -->
  <rect y="864" width="1600" height="136" fill="url(#kz0-floor)"/>
  <rect y="864" width="1600" height="136" fill="#000" filter="url(#kz0-grain)" opacity=".8"/>
  <g stroke="#6B6356" stroke-width="2.500" opacity=".65"><path d="M0 924 H1600 M150 864 L70 1000 M470 864 L430 1000 M790 864 L790 1000 M1110 864 L1150 1000 M1430 864 L1510 1000"/></g>

  <!-- 兩側壓暗 -->
  <rect width="1600" height="1000" fill="url(#kz0-sides)"/>
</svg>

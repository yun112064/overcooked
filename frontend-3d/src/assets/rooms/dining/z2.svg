  <g fill="url(#tz2-flower)"><circle cx="796" cy="494" r="9"/><circle cx="808" cy="502" r="8"/><circle cx="797" cy="508" r="7"/></g>
  <g fill="#FFD27A"><circle cx="796" cy="494" r="3"/><circle cx="808" cy="502" r="2.500"/><circle cx="797" cy="508" r="2.200"/></g>

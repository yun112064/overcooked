      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#E9E2D4"/><stop offset="1" stop-color="#A9A296"/>
    </radialGradient>
    <radialGradient id="tz2-flower" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#FF9A7C"/><stop offset="1" stop-color="#B2301A"/>
    </radialGradient>
  </defs>
  <circle cx="804" cy="505" r="26" fill="#0E0A14" opacity=".5" filter="url(#tz2-b3)"/>
  <circle cx="800" cy="500" r="22" fill="url(#tz2-vase)"/><circle cx="800" cy="500" r="12" fill="#3A2A20"/>

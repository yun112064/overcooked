<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 餐桌 z3：前景——吊燈在桌面正中的暖光、暗角 -->
  <defs>
    <radialGradient id="tz3-light" gradientUnits="userSpaceOnUse" cx="800" cy="500" r="420">
      <stop offset="0" stop-color="#FFF3CF" stop-opacity=".2"/><stop offset="1" stop-color="#FFF3CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tz3-vig" cx=".5" cy=".5" r=".8">
      <stop offset=".5" stop-color="#150F1E" stop-opacity="0"/><stop offset="1" stop-color="#150F1E" stop-opacity=".6"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#tz3-light)"/>
  <rect x="-80" y="-60" width="1760" height="1120" fill="url(#tz3-vig)"/>
</svg>

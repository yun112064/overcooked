<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 大門 z3：前景——失焦的樹叢、垂下的枝葉、螢火蟲 -->
  <defs>
    <filter id="dz3-blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="dz3-fly" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF3C4"/><stop offset=".35" stop-color="#FFE08A" stop-opacity=".8"/><stop offset="1" stop-color="#FFE08A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 左下樹叢 -->
  <g filter="url(#dz3-blur)">
    <g fill="#2E5E3A">
      <circle cx="40" cy="960" r="150"/><circle cx="210" cy="1000" r="120"/><circle cx="-20" cy="820" r="90"/>
    </g>
    <g fill="#3F7D4E">
      <circle cx="120" cy="900" r="80"/><circle cx="270" cy="960" r="64"/><circle cx="30" cy="850" r="56"/>
    </g>
    <g fill="#E8603F"><circle cx="150" cy="872" r="12"/><circle cx="246" cy="930" r="10"/><circle cx="64" cy="900" r="10"/></g>
  </g>

  <!-- 右下樹叢 -->
  <g filter="url(#dz3-blur)">
    <g fill="#2E5E3A">
      <circle cx="1570" cy="960" r="150"/><circle cx="1420" cy="1010" r="110"/><circle cx="1620" cy="830" r="80"/>
    </g>
    <g fill="#3F7D4E">
      <circle cx="1500" cy="910" r="74"/><circle cx="1380" cy="970" r="56"/>
    </g>
    <g fill="#FFD27A"><circle cx="1476" cy="880" r="9"/><circle cx="1540" cy="930" r="8"/><circle cx="1400" cy="950" r="8"/></g>
  </g>

  <!-- 左上垂枝 -->
  <g filter="url(#dz3-blur)">
    <path d="M-20 40 Q160 60 300 150" fill="none" stroke="#6F4E2A" stroke-width="12" stroke-linecap="round"/>
    <g fill="#3F7D4E">
      <ellipse cx="90" cy="90" rx="56" ry="24" transform="rotate(30 90 90)"/>
      <ellipse cx="180" cy="130" rx="60" ry="24" transform="rotate(50 180 130)"/>
      <ellipse cx="270" cy="180" rx="56" ry="22" transform="rotate(64 270 180)"/>
      <ellipse cx="30" cy="20" rx="70" ry="30" transform="rotate(10 30 20)"/>
    </g>
    <g fill="#2E5E3A">
      <ellipse cx="140" cy="60" rx="56" ry="22" transform="rotate(-10 140 60)"/>
      <ellipse cx="240" cy="110" rx="50" ry="20" transform="rotate(6 240 110)"/>
    </g>
  </g>

  <!-- 螢火蟲 -->
  <g>
    <circle cx="330" cy="720" r="16" fill="url(#dz3-fly)"/>
    <circle cx="250" cy="600" r="11" fill="url(#dz3-fly)"/>
    <circle cx="1290" cy="520" r="13" fill="url(#dz3-fly)"/>
    <circle cx="1440" cy="700" r="17" fill="url(#dz3-fly)"/>
    <circle cx="1230" cy="760" r="10" fill="url(#dz3-fly)"/>
    <circle cx="420" cy="480" r="9" fill="url(#dz3-fly)"/>
  </g>
</svg>

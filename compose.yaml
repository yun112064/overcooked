
services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: meal-planner-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: meal_planner

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meal_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    image: meal-planner-backend
    container_name: meal-planner-backend

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/meal_planner
      PROJECT_DATA_ROOT: /app/data
      PYTHONUNBUFFERED: "1"
      PROJECT_RUNTIME_ROOT: /app/runtime
      PROJECT_BACKUP_ROOT: /app/backups
      # 狀態修改請求只接受這些前端來源；正式網域部署時改為 https://<網域>
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # T09 團隊電腦 YOLO 推論服務；未設定時辨識顯示不可用，可手動輸入
      RECOGNITION_SERVICE_URL: ${RECOGNITION_SERVICE_URL:-}
      RECOGNITION_SERVICE_TOKEN: ${RECOGNITION_SERVICE_TOKEN:-}
      # T11 團隊電腦營養知識 RAG 與 OpenAI 向量化；未設定時知識顯示不可用
      KNOWLEDGE_SERVICE_URL: ${KNOWLEDGE_SERVICE_URL:-}
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # T11 小知識說明的生成模型與供應者；留空沿用後端預設（OpenAI 固定版本模型）
      KNOWLEDGE_EXPLAIN_MODEL: ${KNOWLEDGE_EXPLAIN_MODEL:-gpt-5.4-mini-2026-03-17}
      KNOWLEDGE_EXPLAIN_PROVIDER: ${KNOWLEDGE_EXPLAIN_PROVIDER:-openai}
      KNOWLEDGE_OLLAMA_URL: ${KNOWLEDGE_OLLAMA_URL:-}
      KNOWLEDGE_OLLAMA_MODEL: ${KNOWLEDGE_OLLAMA_MODEL:-qwen3.5:9b-q4_K_M}
      # T04 營養證據綁定的資料版本；預設留空（POST /t04-data 回 422 NUTRITION_VERSION_REQUIRED），使用者確認綁定後才設定
      GENERATION_RECIPE_RELEASE_ID: ${GENERATION_RECIPE_RELEASE_ID:-}
      GENERATION_NUTRITION_IMPORT_ID: ${GENERATION_NUTRITION_IMPORT_ID:-}
      GENERATION_FOOD_MAPPING_VERSION: ${GENERATION_FOOD_MAPPING_VERSION:-}
      # 模擬超市；未設定時交接回 503 MARKET_UNAVAILABLE（不開放真實結帳）
      SIM_MARKET_URL: ${SIM_MARKET_URL:-}
      SIM_MARKET_HANDOFF_KEY: ${SIM_MARKET_HANDOFF_KEY:-}
      # R14 團隊電腦飲食小幫手；未設定時小幫手頁顯示未啟用
      ASSISTANT_SERVICE_URL: ${ASSISTANT_SERVICE_URL:-}
      ASSISTANT_SERVICE_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-}
      # OpenAI 版小幫手（選用）：回答經 /internal/assistant/chat 由後端呼叫 OpenAI（T10 額度）
      ASSISTANT_OPENAI_SERVICE_URL: ${ASSISTANT_OPENAI_SERVICE_URL:-}
      ASSISTANT_OPENAI_MODEL: ${ASSISTANT_OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      # 主機端路徑由 .env 的 PROJECT_*_ROOT 設定；未設定時沿用開發機預設位置
      - ${PROJECT_DATA_ROOT:-../AIPE04期末專題_data}:/app/data
      - ${PROJECT_RUNTIME_ROOT:-../AIPE04期末專題_runtime}:/app/runtime
      - ${PROJECT_BACKUP_ROOT:-../AIPE04期末專題_backups}:/app/backups

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    depends_on:
      db:
        condition: service_healthy

  # T10：生成／推論工作程序，可視負載啟動多個副本
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meal-planner-backend
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/meal_planner
      PROJECT_DATA_ROOT: /app/data
      PYTHONUNBUFFERED: "1"
      # T11 知識 RAG 與向量化在 worker 中執行
      KNOWLEDGE_SERVICE_URL: ${KNOWLEDGE_SERVICE_URL:-}
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ${PROJECT_DATA_ROOT:-../AIPE04期末專題_data}:/app/data
    depends_on:
      backend:
        condition: service_healthy

  # T10：單一排程程序（以 PostgreSQL advisory lock 保證只會有一個在執行）
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meal-planner-backend
    command: ["python", "-m", "app.jobs.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/meal_planner
      PROJECT_DATA_ROOT: /app/data
      PYTHONUNBUFFERED: "1"
      LOG_CLEANUP_APPLY: "true"
      # T02 每日查價（由同一個排程程序執行）
      PRICE_SCHEDULER_ENABLED: ${PRICE_SCHEDULER_ENABLED:-true}
      PRICE_SCHEDULER_HOUR: ${PRICE_SCHEDULER_HOUR:-3}
      PRICE_SCHEDULER_MINUTE: ${PRICE_SCHEDULER_MINUTE:-0}
      PRICE_SCHEDULER_TIMEZONE: ${PRICE_SCHEDULER_TIMEZONE:-Asia/Taipei}
      PRICE_WORKBOOK_PATH: ${PRICE_WORKBOOK_PATH_CONTAINER:-/app/data/recipe_dataset_1027.xlsx}
      PRICE_COLLECTION_DELAY_SECONDS: ${PRICE_COLLECTION_DELAY_SECONDS:-1.5}
      PRICE_COLLECTION_TIMEOUT_SECONDS: ${PRICE_COLLECTION_TIMEOUT_SECONDS:-15}
      PRICE_COLLECTION_RETRIES: ${PRICE_COLLECTION_RETRIES:-1}
      PRICE_COLLECTION_BATCH_SIZE: ${PRICE_COLLECTION_BATCH_SIZE:-0}
    volumes:
      - ${PROJECT_DATA_ROOT:-../AIPE04期末專題_data}:/app/data
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # 場景式前端（frontend-3d）；舊版 frontend/ 保留在 repo 但不再建置
  frontend:
    build:
      context: ./frontend-3d
      dockerfile: Dockerfile

    container_name: meal-planner-frontend

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      backend:
        condition: service_healthy

  # 模擬超市（選用）：docker compose --profile sim-market up；後端需設定 SIM_MARKET_URL=http://127.0.0.1:8081 與 SIM_MARKET_HANDOFF_KEY
  sim-supermarket:
    profiles: [sim-market]
    build:
      context: ./sim-supermarket
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_data:
